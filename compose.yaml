name: cleaning

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cleaning
      POSTGRES_USER: cleaning
      POSTGRES_PASSWORD: cleaning
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleaning -d cleaning"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
